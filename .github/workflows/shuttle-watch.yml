# /presidio/ shuttle watch: record Presidio GO's live feed through the commute, then run the evals on that real data.
# Every weekday morning (5:30-9:45) and evening (2:30-7:15) Pacific through Fri Nov 6 2026, then Monday mornings only.
# GitHub starts scheduled runs late, often by hours (Oct 9-23 the 5:50am run started 10:00-11:51am and recorded
# nothing), so it checks every 30 minutes and the first check inside a window records until that window ends. It
# catches changes in how the feed behaves, which no code change would surface. A failure (red run, emailed by GitHub)
# means the page would have shown a departure time after a shuttle actually left, or dropped one still coming.
# Recordings are kept on the shuttle-recordings branch as regression cases.
name: shuttle-watch
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Record this many minutes (default: until the end of the commute window)"
        required: false
permissions:
  contents: write
concurrency:
  group: shuttle-watch
  cancel-in-progress: false
jobs:
  # Records when a check lands inside a window that has no recording yet (manual runs always record).
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          day=$(TZ=America/Los_Angeles date +%Y%m%d); dow=$(TZ=America/Los_Angeles date +%u); hm=$(TZ=America/Los_Angeles date +%H%M)
          part=""
          if [ "$dow" -le 5 ] && [ "$hm" -ge 530 ] && [ "$hm" -lt 930 ]; then part=am
          elif [ "$dow" -le 5 ] && [ "$hm" -ge 1430 ] && [ "$hm" -lt 1900 ]; then part=pm; fi
          if [ -z "$part" ] || { [ "$day" -gt 20261106 ] && ! { [ "$dow" = 1 ] && [ "$part" = am ]; }; }; then
            echo "outside a recording window ($day $hm)"; echo run=false >> "$GITHUB_OUTPUT"; exit 0
          fi
          name="$(TZ=America/Los_Angeles date +%Y-%m-%d)-$part.jsonl.gz"
          size=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/contents/$name?ref=shuttle-recordings" 2>/dev/null | jq -r '.size // 0' || echo 0)
          if [ "${size:-0}" -gt 1000 ]; then echo "$name already recorded"; echo run=false >> "$GITHUB_OUTPUT"
          else echo "recording $name"; echo run=true >> "$GITHUB_OUTPUT"; fi
  watch:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Record the live feed
        run: |
          python3 -m venv /tmp/v && /tmp/v/bin/pip -q install gtfs-realtime-bindings
          now=$(TZ=America/Los_Angeles date +%H%M)
          if [ -n "${{ github.event.inputs.minutes }}" ]; then mins=${{ github.event.inputs.minutes }}; part=manual
          elif [ "$now" -lt 1200 ]; then end=$(TZ=America/Los_Angeles date -d "09:45" +%s); part=am
          else end=$(TZ=America/Los_Angeles date -d "19:15" +%s); part=pm; fi
          [ -z "$mins" ] && mins=$(( (end - $(date +%s)) / 60 ))
          name="$(TZ=America/Los_Angeles date +%Y-%m-%d)-$part"
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "Recording $mins minutes as $name"
          mkdir -p /tmp/rec && /tmp/v/bin/python tools/evals/record.py /tmp/rec "$mins"
          gzip -9 -c /tmp/rec/feed.jsonl > "/tmp/rec/$name.jsonl.gz"
          gzip -9 -c /tmp/rec/api.jsonl > "/tmp/rec/$name.api.jsonl.gz"
          # The timetable in force that day (the evals fall back to tools/evals/recordings/gtfs.zip without it).
          cp tools/evals/recordings/gtfs.zip /tmp/rec/gtfs.zip
          curl -fsS --retry 3 -o "/tmp/rec/$name.gtfs.zip" https://presidiobus.com/gtfs.zip || rm -f "/tmp/rec/$name.gtfs.zip"
      - name: Keep the recording (shuttle-recordings branch)
        if: always()
        run: |
          [ -f "/tmp/rec/$NAME.jsonl.gz" ] || exit 0
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin shuttle-recordings && git worktree add -q /tmp/store origin/shuttle-recordings \
            || { git worktree add -q --detach /tmp/store && git -C /tmp/store checkout -q --orphan shuttle-recordings && git -C /tmp/store rm -rqf . ; }
          # Never overwrite a good recording of the same window (a second run after a crash keeps both).
          keep="$NAME"; [ -f "/tmp/store/$NAME.jsonl.gz" ] && [ "$(stat -c%s "/tmp/store/$NAME.jsonl.gz")" -gt 1000 ] && keep="$NAME-$(TZ=America/Los_Angeles date +%H%M)"
          cp "/tmp/rec/$NAME.jsonl.gz" "/tmp/store/$keep.jsonl.gz"; cp "/tmp/rec/$NAME.api.jsonl.gz" "/tmp/store/$keep.api.jsonl.gz"
          [ -f "/tmp/rec/$NAME.gtfs.zip" ] && cp "/tmp/rec/$NAME.gtfs.zip" "/tmp/store/$keep.gtfs.zip"
          cd /tmp/store && git add -A && git commit -qm "recording $NAME" && git push -q origin HEAD:shuttle-recordings
      - name: Deterministic eval on today's feed
        run: |
          if [ "$(zcat "/tmp/rec/$NAME.jsonl.gz" | wc -l)" -lt 10 ]; then echo "::warning::recording $NAME is empty; nothing to evaluate"; exit 0; fi
          node tools/evals/shuttle-eval.js "/tmp/rec/$NAME.jsonl.gz" --report /tmp/rec/eval.json
      # ~$2 a run (capped at 40 screens); skipped unless the ANTHROPIC_API_KEY secret is set.
      - name: LLM-judged eval on today's feed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::notice::ANTHROPIC_API_KEY secret not set; skipping the LLM-judged eval"; exit 0; fi
          npm install --no-save --no-audit --no-fund @anthropic-ai/sdk playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node tools/evals/shuttle-llm-eval.mjs "/tmp/rec/$NAME.jsonl.gz" --report /tmp/rec/llm-eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shuttle-watch-${{ env.NAME }}
          path: /tmp/rec/*.json*
          if-no-files-found: ignore
