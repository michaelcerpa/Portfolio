name: presidio-probe
on:
  push:
    branches: [claude/presidio-probe]
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v5
      - name: Record the live feed until ~9:30am PT, publishing every 10 minutes
        run: |
          python3 -m venv /tmp/v && /tmp/v/bin/pip -q install gtfs-realtime-bindings
          mkdir -p /tmp/rec
          for i in $(seq 1 15); do
            /tmp/v/bin/python tools/presidio_record.py /tmp/rec 10
            ( cd /tmp/rec && rm -rf .git && git init -q -b claude/presidio-fixtures && git config user.name "github-actions[bot]" \
              && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add -A \
              && git commit -qm "presidio feed recording ($i)" \
              && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" claude/presidio-fixtures ) || true
            [ "$(TZ=America/Los_Angeles date +%H%M)" -ge 0935 ] && break
          done
