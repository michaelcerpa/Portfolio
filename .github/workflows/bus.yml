# /bus/ (Golden Gate Transit) and /presidio/ (Presidio GO) commute trackers: test against fresh snapshots of both
# agencies' feeds, and check the live apps weekly (a failure email here usually means an agency changed its feed or timetable).
name: bus
on:
  push:
    branches: [main]
    paths: ["bus/**", "presidio/**", "api/**", "tools/bus*", "tools/shuttle*", "tools/evals/**", ".github/workflows/bus.yml"]
  pull_request:
    paths: ["bus/**", "presidio/**", "api/**", "tools/bus*", "tools/shuttle*", "tools/evals/**", ".github/workflows/bus.yml"]
  schedule:
    - cron: "11 14 * * 1"   # Mondays, before the morning commute
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download a live Golden Gate snapshot
        run: |
          mkdir -p /tmp/ggt && cd /tmp/ggt
          curl -fsS --retry 3 -o GTFSTransitData.zip https://realtime.goldengate.org/gtfsstatic/GTFSTransitData.zip
          curl -fsS --retry 3 -o TripUpdates-now.pb https://realtime.goldengate.org/gtfsrealtime/TripUpdates
          curl -fsS --retry 3 -o VehiclePositions-now.pb https://realtime.goldengate.org/gtfsrealtime/VehiclePositions
      - run: node --test tools/bus.test.js
        env:
          GGT_FIXTURES: /tmp/ggt
      - name: Download a live Presidio GO snapshot
        run: |
          mkdir -p /tmp/pgo && cd /tmp/pgo
          curl -fsS --retry 3 -o GTFSTransitData.zip https://presidiobus.com/gtfs.zip
          curl -fsS --retry 3 -o TripUpdates-now.pb https://presidiobus.com/gtfs-rt/tripupdates
          curl -fsS --retry 3 -o VehiclePositions-now.pb https://presidiobus.com/gtfs-rt/vehiclepositions
      - run: node --test tools/shuttle.test.js
        env:
          PGO_FIXTURES: /tmp/pgo
      # Replays recorded live feeds against GPS departures (tools/evals/): never a time after a shuttle left, never
      # dropped while at the stop. Also checks that the pre-fix logic fails it (the eval can see that bug).
      - run: node --test tools/evals/eval.test.js
      - name: Check the deployed app
        if: github.event_name != 'pull_request'
        run: |
          # A push to main races Vercel's deploy, so give the pages and the APIs up to 5 minutes to come up.
          API="https://mcerpa.com/api/ggt/?from=40033&to=42203,40053"
          for i in $(seq 1 30); do
            curl -fsS https://mcerpa.com/bus/ 2>/dev/null | grep -q 'id="rows"' && curl -fsS "$API" -o /tmp/api.json 2>/dev/null &&
              curl -fsS https://mcerpa.com/presidio/ 2>/dev/null | grep -q 'id="hasPass"' && curl -fsS "https://mcerpa.com/api/pgo/" -o /dev/null 2>/dev/null && break
            sleep 10
          done
          curl -fsS https://mcerpa.com/bus/ | grep -q 'id="rows"'
          curl -fsS --retry 3 "$API" > /tmp/api.json
          node -e '
            const b = require("/tmp/api.json");
            if (!Array.isArray(b.departures) || !b.origin) throw new Error("bad API body: " + JSON.stringify(b).slice(0, 300));
            console.log("feed ok:", b.feed.ok, "| departures:", b.departures.length, "| timetable valid until", b.schedule.validUntil);
            for (const d of b.departures.slice(0, 5)) console.log(d.route, d.status, new Date(d.sched * 1000).toISOString(), d.delay);'
          # The evening direction: Mission & 2nd / Pine & Battery → Lombard & Fillmore northbound.
          curl -fsS --retry 3 "https://mcerpa.com/api/ggt/?from=42207,40069,42237&to=40034" > /tmp/home.json
          node -e '
            const b = require("/tmp/home.json");
            if (!Array.isArray(b.departures) || !b.origins?.length) throw new Error("bad home API body: " + JSON.stringify(b).slice(0, 300));
            console.log("home departures:", b.departures.length, b.later ? "| next later: " + b.later.route : "");'
          # The Presidio GO shuttle page and its API (both directions, both downtown pick-ups).
          curl -fsS --retry 3 https://mcerpa.com/presidio/ | grep -q 'id="hasPass"'
          for q in "from=31933&to=8894813" "from=8894813&to=31980" "from=839326&to=31980"; do
            curl -fsS --retry 3 "https://mcerpa.com/api/pgo/?$q" > /tmp/pgo.json
            node -e '
              const b = require("/tmp/pgo.json");
              if (!Array.isArray(b.departures) || !b.origin) throw new Error("bad shuttle API body: " + JSON.stringify(b).slice(0, 300));
              console.log("shuttle from", b.origin.name, "| feed ok:", b.feed.ok, "| departures:", b.departures.length, b.holiday ? "| " + b.holiday : "");'
          done
