<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shuttle</title>
  <meta name="description" content="Presidio GO between Lombard Gate and 50 Beale St — live shuttle departures both ways.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#08130D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Shuttle">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="../fonts/SpaceGrotesk-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../fonts/JetBrainsMono-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../bus/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>

<header class="top">
  <div class="route-title">
    <div class="eyebrow">Presidio GO</div>
    <h1 id="title">Lombard Gate <span class="arrow">→</span> 50 Beale</h1>
    <p class="greet" id="greet" hidden>Happy Friday! Have a nice day, sugar pumpkin pie. See you tonight.</p>
  </div>
</header>

<div class="dirs" role="tablist" aria-label="Direction">
  <button role="tab" data-dir="work" aria-selected="true">To work</button>
  <button role="tab" data-dir="home" aria-selected="false">To home</button>
</div>
<div class="pickup" id="pickup" role="radiogroup" aria-labelledby="pickupLabel" hidden></div>

<div class="feed" id="feed" role="status" aria-live="polite" hidden>
  <span class="beacon" aria-hidden="true"></span><span id="feedText"></span>
</div>
<div class="note" id="note" role="status" hidden></div>

<main>
  <section class="hero" id="hero" aria-live="polite">
    <div class="hero-empty">Loading departures…</div>
  </section>
  <section class="report" id="report" hidden></section>

  <section class="recent" id="recent" hidden></section>

  <section class="map-wrap">
    <div id="map" aria-label="Map of shuttles heading to your stop"></div>
    <button class="map-fit" id="fit" aria-label="Show all shuttles">fit</button>
  </section>

  <section class="list">
    <h2 class="kicker">Next shuttles from your stop</h2>
    <ol id="rows"></ol>
  </section>
</main>

<footer class="foot" id="foot"></footer>

<section class="ride" id="ride" hidden aria-live="polite">
  <div class="ride-head" id="rideHead">
    <header class="ride-top">
      <div class="ride-title" id="rideTitle"></div>
      <button class="ghost" id="endRide">End ride</button>
    </header>
    <div class="ride-hero" id="rideHero"></div>
  </div>
  <ol class="stops" id="rideStops"></ol>
  <p class="fine ride-fine">Keep this open for the alert.</p>
</section>

<script src="../bus/vendor/leaflet/leaflet.js"></script>
<script src="../bus/ride.js"></script>
<script src="timing.js"></script>
<script src="app.js"></script>
</body>
</html>
