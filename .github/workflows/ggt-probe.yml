name: ggt-probe
on:
  push:
    branches: [claude/ggt-bus-tracker]
    paths: ["tools/ggt_probe*.py", ".github/workflows/ggt-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q gtfs-realtime-bindings
          /tmp/venv/bin/python tools/ggt_probe3.py /tmp/fixtures
      - name: Publish fixtures to a side branch
        run: |
          cd /tmp/fixtures
          git init -q -b claude/ggt-fixtures
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "GGT feed fixtures"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" claude/ggt-fixtures
